plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redfx" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":common").sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(":common")
}

processResources {
	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	inputs.property "version", version
	inputs.property "minecraftDependency", minecraftDependency

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version, "minecraftDependency": minecraftDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-neoforge.jar"
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Automatically copy built jar to release directory in the project root
tasks.register('copyJarToRelease', Copy) {
	from tasks.named('jar')
	into "${project.rootDir}/release"

	mustRunAfter tasks.named('jar')
}

tasks.named('build') {
	finalizedBy('copyJarToRelease')
}
