plugins {
	id 'net.neoforged.moddev.legacyforge' version '2.0.143'
	id 'com.modrinth.minotaur'
	id 'net.darkhax.curseforgegradle'
}

// -PtestJar must load the mod from the packaged jar and nothing else.
def isTestJar = project.hasProperty('testJar')

legacyForge {
	version = "${project.forge_version}"

	runs {
		client {
			client()

			if (isTestJar) {
				gameDirectory = project.file('run-testjar')
			} else {
				systemProperty 'redfx.debug', 'true'
			}

			if (project.hasProperty('quickPlaySingleplayer')) {
				programArgument '--quickPlaySingleplayer'
				programArgument project.property('quickPlaySingleplayer').toString()
			}
		}
	}

	if (!isTestJar) {
		mods {
			redfx {
				sourceSet sourceSets.main
			}
		}
	}
}

sourceSets {
	main {
		java {
			srcDir project(':common').file('src/main/java')
		}
		resources {
			srcDir project(':common').file('src/main/resources')
		}
	}
}

mixin {
	add sourceSets.main, 'redfx.refmap.json'
	config 'redfx.mixins.json'
	config 'redfx.client.mixins.json'
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Stage the packaged (reobfuscated) jar as the only mod in the -PtestJar run directory.
tasks.register('installTestJar', Copy) {
	from tasks.named('reobfJar')
	into layout.projectDirectory.dir('run-testjar/mods')

	doFirst {
		delete fileTree(layout.projectDirectory.dir('run-testjar/mods')) {
			include 'redfx-*.jar'
		}
	}
}

processResources {
	def modVersion = project.mod_version
	def minecraftDependencyMaven = project.minecraft_dependency_maven
	def forgeDependency = project.forge_dependency
	def mixinCompatLevel = project.mixin_compat_level
	inputs.property "modVersion", modVersion
	inputs.property "minecraftDependencyMaven", minecraftDependencyMaven
	inputs.property "forgeDependency", forgeDependency
	inputs.property "mixinCompatLevel", mixinCompatLevel

	filesMatching("META-INF/mods.toml") {
		expand "modVersion": modVersion,
				"minecraftDependencyMaven": minecraftDependencyMaven,
				"forgeDependency": forgeDependency
	}

	filesMatching(["redfx.mixins.json", "redfx.client.mixins.json"]) {
		expand "mixinCompatLevel": mixinCompatLevel
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}

jar {
	archiveClassifier = 'slim'
	def projectName = project.name
	inputs.property "projectName", projectName

	manifest.attributes([
		"MixinConfigs": "redfx.mixins.json,redfx.client.mixins.json"
	])

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

tasks.named('reobfJar') {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-forge.jar"
}

// Automatically copy built jar to release directory in the project root
tasks.register('copyJarToRelease', Copy) {
	from tasks.named('reobfJar')
	into "${project.rootDir}/release"

	mustRunAfter tasks.named('reobfJar')
}

tasks.named('build') {
	dependsOn('reobfJar')
	finalizedBy('copyJarToRelease')
}

afterEvaluate {
	tasks.named('runClient') {
		if (isTestJar) {
			dependsOn(tasks.named('installTestJar'))
			setClasspath(classpath.filter { File file ->
				!file.path.contains("common/build/classes") &&
				!file.path.contains("common/build/resources") &&
				!file.path.contains("neoforge/build/classes") &&
				!file.path.contains("neoforge/build/resources")
			})
		}
	}
}

modrinth {
	token = rootProject.getModrinthToken()
	projectId = project.modrinth_project_id

	debugMode = project.hasProperty('publishDebug')
	versionNumber = "${project.mod_version}-${project.mc_version_suffix}-forge"
	versionName = "RedFX ${project.mod_version} (Forge / NeoForge)"
	versionType = "release"
	uploadFile = tasks.named('reobfJar').flatMap { it.archiveFile }
	gameVersions = project.modrinth_game_versions.split(",") as List
	loaders = ["forge", "neoforge"]

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		changelog = notesFile.text
	}
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = rootProject.getCurseForgeToken()

	debugMode = project.hasProperty('publishDebug')

	def mainFile = upload(project.curseforge_project_id, tasks.named('reobfJar'))
	mainFile.displayName = "RedFX ${project.mod_version} (Forge / NeoForge)"
	mainFile.releaseType = "release"
	mainFile.changelogType = "markdown"

	project.curseforge_game_versions.split(",").each {
		mainFile.addGameVersion(it)
	}
	mainFile.addModLoader("Forge")
	mainFile.addModLoader("NeoForge")

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		mainFile.changelog = notesFile.text
	}
}
