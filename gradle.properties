# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

org.gradle.java.home=/home/ptphong/.gradle/jdks/eclipse_adoptium-25-amd64-linux.2

# Fabric Properties
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Toolchain
java_version=25
mixin_compat_level=JAVA_25

# Mod Properties
mc_version_suffix=mc26.2.x
minecraft_dependency=>=26.2.0- <26.3.0
# NeoForge parses Maven version ranges, not SemVer - the two formats are not interchangeable.
minecraft_dependency_maven=[26.2,26.3)
fabric_loader_dependency=>=0.16.0
neoforge_version=26.2.0.45-beta
neoforge_dependency=[26.2.0,)

# Dependencies
fabric_api_version=0.154.0+26.2
modmenu_version=18.0.0

# Modrinth Automation
modrinth_game_versions=26.2

# CurseForge Automation
curseforge_game_versions=26.2
