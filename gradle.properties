# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.20.1
loader_version=0.16.10
loom_version=1.14.10

# Toolchain
java_version=17
mixin_compat_level=JAVA_17

# Mod Properties
mc_version_suffix=mc1.20.1
minecraft_dependency=>=1.20.0 <1.20.2
# Forge/NeoForge parses Maven version ranges, not SemVer - the two formats are not interchangeable.
minecraft_dependency_maven=[1.20.1,1.20.2)
fabric_loader_dependency=>=0.15.0
forge_version=1.20.1-47.3.0
forge_dependency=[47.1.0,)

# Dependencies
fabric_api_version=0.92.2+1.20.1
modmenu_version=7.2.2

# Modrinth Automation
modrinth_game_versions=1.20.1

# CurseForge Automation
curseforge_game_versions=1.20.1

