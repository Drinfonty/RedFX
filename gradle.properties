# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

org.gradle.java.home=/home/ptphong/.gradle/jdks/eclipse_adoptium-25-amd64-linux.2

# Fabric Properties
minecraft_version=1.21.10
loader_version=0.19.3
loom_version=1.14.10

# Toolchain
java_version=21
mixin_compat_level=JAVA_21

# Mod Properties
mc_version_suffix=mc1.21.10
minecraft_dependency=>=1.21.9 <1.21.11
# NeoForge parses Maven version ranges, not SemVer - the two formats are not interchangeable.
minecraft_dependency_maven=[1.21.9,1.21.11)
fabric_loader_dependency=>=0.15.0
neoforge_version=21.10.9-beta
neoforge_dependency=[21.9.0,21.11)

# Dependencies
fabric_api_version=0.138.4+1.21.10
modmenu_version=11.0.1

# Modrinth Automation
modrinth_game_versions=1.21.9,1.21.10

# CurseForge Automation
curseforge_game_versions=1.21.9,1.21.10
