# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `shared` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Toolchain
java_version=25
mixin_compat_level=JAVA_25

# Mod Properties
mc_version_suffix=mc26.3.x
minecraft_dependency=>=26.3.0- <26.4.0
# NeoForge parses Maven version ranges, not SemVer - the two formats are not interchangeable.
minecraft_dependency_maven=[26.3,26.4)
fabric_loader_dependency=>=0.16.0
neoforge_version=26.3.0.4-beta
neoforge_dependency=[26.3.0,)

# Dependencies
fabric_api_version=0.160.7+26.3
modmenu_version=21.0.0-beta.1

# Modrinth Automation
modrinth_game_versions=26.3

# CurseForge Automation
curseforge_game_versions=26.3
