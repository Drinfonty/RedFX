plugins {
	// The Loom plugin id is the one thing that genuinely differs between the modern
	// branches and legacy-1.21 (fabric-loom-remap), and `plugins {}` requires a literal
	// string, so it cannot come from a property. Everything else in this file is driven
	// by gradle.properties and is identical across branches.
	id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	compileOnly "org.spongepowered:mixin:0.8.7"

	// Loom's Minecraft jar annotates client-only classes with
	// @net.fabricmc.api.Environment(EnvType.CLIENT). Without fabric-loader on the compile
	// classpath javac cannot resolve that enum and emits "unknown enum constant
	// EnvType.CLIENT" once per annotated class it loads. compileOnly keeps it out of the
	// runtime classpath and out of the published jars, so :neoforge is unaffected - this
	// only gives javac the annotation classes it is already being asked to read.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	// Mixin rejects a compatibilityLevel above the running JRE, so it has to track the
	// branch's Java level rather than being hardcoded in the JSON.
	def mixinCompatLevel = project.mixin_compat_level
	inputs.property "mixinCompatLevel", mixinCompatLevel

	filesMatching(["redfx.mixins.json", "redfx.client.mixins.json"]) {
		expand "mixinCompatLevel": mixinCompatLevel
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}

loom {
	mixin {
		// Pinned rather than left to the Loom default. The mixins live in :common but are
		// packaged and remapped by the platform subprojects; Loom's legacy
		// annotation-processor path writes its shadow/accessor mappings into *this*
		// project's build cache while :fabric:remapJar looks under its own, so they were
		// silently dropped and @Shadow members shipped in Mojang names - the 1.1.2
		// production crash. Hard remapping reads the @Mixin annotations straight from the
		// bytecode, so it works no matter which project compiled the class.
		//
		// Loom 1.17 already defaults this to false and the modern branches do no remapping
		// at all, so this is a no-op there. It is set on every branch anyway so that a
		// future change to Loom's default cannot quietly reintroduce the bug.
		useLegacyMixinAp = false
	}
}

// This branch remaps; :common's own jar stays in the named namespace so the platform
// subprojects remap once, at :fabric:remapJar.
remapJar {
	targetNamespace = "named"
}
