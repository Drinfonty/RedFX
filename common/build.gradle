plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	compileOnly "org.spongepowered:mixin:0.8.7"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

loom {
	mixin {
		// The mixins live in :common but are packaged and remapped by the platform
		// subprojects. Loom's legacy annotation-processor path writes its shadow/accessor
		// mappings into *this* project's build cache, and :fabric:remapJar looks for them
		// under its own build cache, so they were silently dropped and @Shadow members were
		// left in Mojang names. Hard remapping reads the @Mixin annotations straight from
		// the bytecode, so it works no matter which project compiled the class.
		useLegacyMixinAp = false
	}
}

remapJar {
	targetNamespace = "named"
}
