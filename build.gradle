plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

allprojects {
	repositories {
		mavenCentral()
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "TerraformersMC"
			url = "https://maven.terraformersmc.com/releases/"
		}
		maven {
			name = "NeoForge"
			url = "https://maven.neoforged.net/releases/"
		}
	}
}
