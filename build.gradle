plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0' apply false
	id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
}

allprojects {
	// Without this project.version is "unspecified", which is what fabric.mod.json's
	// ${version} placeholder was being expanded to.
	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		mavenCentral()
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "TerraformersMC"
			url = "https://maven.terraformersmc.com/releases/"
		}
		maven {
			name = "NeoForge"
			url = "https://maven.neoforged.net/releases/"
		}
	}
}

ext.getModrinthToken = {
	def token = System.getenv("MODRINTH_TOKEN")
	if (token == null || token.isEmpty()) {
		def localPropertiesFile = project.rootProject.file('local.properties')
		if (localPropertiesFile.exists()) {
			def localProperties = new Properties()
			localPropertiesFile.withInputStream { localProperties.load(it) }
			token = localProperties.getProperty('modrinth.token')
		}
	}
	return token
}

ext.getCurseForgeToken = {
	def token = System.getenv("CURSEFORGE_TOKEN")
	if (token == null || token.isEmpty()) {
		def localPropertiesFile = project.rootProject.file('local.properties')
		if (localPropertiesFile.exists()) {
			def localProperties = new Properties()
			localPropertiesFile.withInputStream { localProperties.load(it) }
			token = localProperties.getProperty('curseforge.token')
		}
	}
	return token
}
