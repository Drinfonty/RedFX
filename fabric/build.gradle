plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'com.modrinth.minotaur'
	id 'net.darkhax.curseforgegradle'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redfx" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":common").sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation project(":common")
}

processResources {
	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	def fabricLoaderDependency = project.fabric_loader_dependency
	def javaVersion = project.java_version
	inputs.property "version", version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "fabricLoaderDependency", fabricLoaderDependency
	inputs.property "javaVersion", javaVersion

	filesMatching("fabric.mod.json") {
		expand "version": version,
				"minecraftDependency": minecraftDependency,
				"fabricLoaderDependency": fabricLoaderDependency,
				"javaVersion": javaVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}

jar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar"
	def projectName = project.name
	inputs.property "projectName", projectName

	from project(":common").sourceSets.main.output

	// LICENSE lives at the repo root; a bare "LICENSE" resolves against the subproject
	// directory, so this silently packaged nothing.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

remapJar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar"
}

apply from: rootProject.file('gradle/verify-remapped-mixins.gradle')
apply from: rootProject.file('gradle/prod-client.gradle')

// Any remapJar is validated, and a jar that would crash a production client never reaches
// the release folder or the mods directory.
remapJar {
	finalizedBy 'verifyRemappedMixins'
}

tasks.named('check') {
	dependsOn 'verifyRemappedMixins'
}

// Automatically deploy built jar to Minecraft mods directory
tasks.register('copyJarToMods', Copy) {
	dependsOn 'verifyRemappedMixins'
	from tasks.named('remapJar')
	into "/home/ptphong/.minecraft/mods"

	doFirst {
		fileTree("/home/ptphong/.minecraft/mods").matching {
			include "redfx-*.jar"
		}.each { file ->
			delete file
		}
	}
}

// Automatically copy built jar to release directory in the project root
tasks.register('copyJarToRelease', Copy) {
	dependsOn 'verifyRemappedMixins'
	from tasks.named('remapJar')
	into "${project.rootDir}/release"
}

tasks.named('build') {
	finalizedBy('copyJarToMods', 'copyJarToRelease')
}

loom {
	mixin {
		// Must match :common - see the comment there.
		useLegacyMixinAp = false
	}
}

afterEvaluate {
	tasks.named('runClient') {
		if (project.hasProperty('testJar')) {
			// -PtestJar cannot validate a production jar on this branch. Loom's runClient
			// is a named-namespace game, but the published jar is remapped to
			// intermediary, so Mixin cannot find net.minecraft.class_703, logs
			// "@Mixin target ... was not found" at WARN, skips every mixin, and still
			// reaches the main menu. That false pass is exactly how 1.1.1 and 1.1.2 were
			// published broken. Use runProdClient, which launches a real
			// intermediary-namespace client.
			throw new GradleException(
					"-PtestJar cannot verify a production Fabric jar on this branch: the\n" +
					"published jar is in the intermediary namespace but runClient is named,\n" +
					"so mixins are silently skipped and the client boots looking healthy.\n\n" +
					"Use:  ./gradlew :fabric:runProdClient")
		} else {
			classpath.from(project(":common").tasks.named('jar'))
			// Per-hit diagnostics for development only. Deliberately not set under
			// -PtestJar, so that run stays a faithful rehearsal of what a player sees.
			systemProperty 'redfx.debug', 'true'
		}
	}
}

modrinth {
	token = rootProject.getModrinthToken()
	projectId = project.modrinth_project_id

	// ./gradlew modrinth -PpublishDebug validates the release and prints what would
	// be sent, without uploading, so a publish can be rehearsed. Gated on a property
	// rather than a hardcoded true so it cannot be left switched on by accident.
	debugMode = project.hasProperty('publishDebug')
	versionNumber = "${project.mod_version}-${project.mc_version_suffix}-fabric"
	versionName = "RedFX ${project.mod_version} (Fabric)"
	versionType = "release"
	uploadFile = layout.buildDirectory.file("libs/redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar")
	gameVersions = project.modrinth_game_versions.split(",") as List
	loaders = ["fabric"]

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		changelog = notesFile.text
	}

	dependencies {
		required.project "P7dR8mSH" // Fabric API
	}
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = rootProject.getCurseForgeToken()

	// ./gradlew curseforge -PpublishDebug validates the release and prints what would
	// be sent, without uploading, so a publish can be rehearsed.
	debugMode = project.hasProperty('publishDebug')

	def mainFile = upload(project.curseforge_project_id, tasks.named('jar'))
	mainFile.displayName = "RedFX ${project.mod_version} (Fabric)"
	mainFile.releaseType = "release"
	mainFile.changelogType = "markdown"

	project.curseforge_game_versions.split(",").each {
		mainFile.addGameVersion(it)
	}
	mainFile.addModLoader("Fabric")

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		mainFile.changelog = notesFile.text
	}

	mainFile.addRequirement("fabric-api")
}
