plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redfx" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":common").sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:18.0.0"

	implementation project(":common")
}

processResources {
	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	inputs.property "version", version
	inputs.property "minecraftDependency", minecraftDependency

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraftDependency": minecraftDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar"
	def projectName = project.name
	inputs.property "projectName", projectName

	from project(":common").sourceSets.main.output

	// LICENSE lives at the repo root; a bare "LICENSE" resolves against the subproject
	// directory, so this silently packaged nothing.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// Automatically deploy built jar to Minecraft mods directory
tasks.register('copyJarToMods', Copy) {
	from tasks.named('jar')
	into "/home/ptphong/.minecraft/mods"

	doFirst {
		fileTree("/home/ptphong/.minecraft/mods").matching {
			include "redfx-*.jar"
		}.each { file ->
			delete file
		}
	}

	mustRunAfter tasks.named('jar')
}

// Automatically copy built jar to release directory in the project root
tasks.register('copyJarToRelease', Copy) {
	from tasks.named('jar')
	into "${project.rootDir}/release"

	mustRunAfter tasks.named('jar')
}

tasks.named('build') {
	finalizedBy('copyJarToRelease')
}

afterEvaluate {
	tasks.named('runClient') {
		if (project.hasProperty('testJar')) {
			dependsOn(tasks.named('jar'))
			setClasspath(classpath.filter { File file ->
				!file.path.contains("common/build/classes") &&
				!file.path.contains("common/build/resources") &&
				!file.path.contains("fabric/build/classes") &&
				!file.path.contains("fabric/build/resources")
			})
			classpath.from(tasks.named('jar'))
		}
	}
}

modrinth {
	token = rootProject.getModrinthToken()
	projectId = project.modrinth_project_id
	versionNumber = "${project.mod_version}-${project.mc_version_suffix}-fabric"
	versionName = "RedFX ${project.mod_version} (Fabric)"
	versionType = "release"
	uploadFile = layout.buildDirectory.file("libs/redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar")
	gameVersions = project.modrinth_game_versions.split(",") as List
	loaders = ["fabric"]

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		changelog = notesFile.text
	}

	dependencies {
		required.project "P7dR8mSH" // Fabric API
	}
}
