plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'com.modrinth.minotaur'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redfx" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":common").sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:11.0.1"

	implementation project(":common")
}

processResources {
	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	inputs.property "version", version
	inputs.property "minecraftDependency", minecraftDependency

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraftDependency": minecraftDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar"
	def projectName = project.name
	inputs.property "projectName", projectName

	from project(":common").sourceSets.main.output

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

remapJar {
	archiveFileName = "redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar"
}

apply from: rootProject.file('gradle/verify-remapped-mixins.gradle')

// Any remapJar is validated, and a jar that would crash a production client never reaches
// the release folder or the mods directory.
remapJar {
	finalizedBy 'verifyRemappedMixins'
}

tasks.named('check') {
	dependsOn 'verifyRemappedMixins'
}

// Automatically deploy built jar to Minecraft mods directory
tasks.register('copyJarToMods', Copy) {
	dependsOn 'verifyRemappedMixins'
	from tasks.named('remapJar')
	into "/home/ptphong/.minecraft/mods"

	doFirst {
		fileTree("/home/ptphong/.minecraft/mods").matching {
			include "redfx-*.jar"
		}.each { file ->
			delete file
		}
	}
}

// Automatically copy built jar to release directory in the project root
tasks.register('copyJarToRelease', Copy) {
	dependsOn 'verifyRemappedMixins'
	from tasks.named('remapJar')
	into "${project.rootDir}/release"
}

tasks.named('build') {
	finalizedBy('copyJarToMods', 'copyJarToRelease')
}

loom {
	mixin {
		// Must match :common - see the comment there.
		useLegacyMixinAp = false
	}
}

afterEvaluate {
	tasks.named('runClient') {
		if (project.hasProperty('testJar')) {
			dependsOn(tasks.named('remapJar'))
			setClasspath(classpath.filter { File file ->
				!file.path.contains("common/build/classes") &&
				!file.path.contains("common/build/resources") &&
				!file.path.contains("fabric/build/classes") &&
				!file.path.contains("fabric/build/resources")
			})
			classpath.from(tasks.named('remapJar'))
			systemProperty "fabric.development", "false"
		} else {
			classpath.from(project(":common").tasks.named('jar'))
		}
	}
}

modrinth {
	token = rootProject.getModrinthToken()
	projectId = project.modrinth_project_id
	versionNumber = "${project.mod_version}-fabric"
	versionName = "RedFX ${project.mod_version} (Fabric)"
	versionType = "release"
	uploadFile = layout.buildDirectory.file("libs/redfx-${project.mod_version}-${project.mc_version_suffix}-fabric.jar")
	gameVersions = project.modrinth_game_versions.split(",") as List
	loaders = ["fabric"]

	def notesFile = rootProject.file("release/release-note-${project.mod_version}.md")
	if (notesFile.exists()) {
		changelog = notesFile.text
	}

	dependencies {
		required.project "P7dR8mSH" // Fabric API
	}
}
